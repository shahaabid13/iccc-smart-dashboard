<ion-page>
  <app-offline-banner></app-offline-banner>
  <ion-header translucent>
    <ion-toolbar>
      <ion-title>CIMS Field App</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Field-person login</ion-card-title>
        <ion-card-subtitle>Sign in to access incident assignments</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" class="form-stack">
          <ion-item lines="none">
            <ion-label position="stacked">Username</ion-label>
            <ion-input formControlName="username" type="text" autocomplete="username"></ion-input>
          </ion-item>

          <ion-item lines="none">
            <ion-label position="stacked">Password</ion-label>
            <ion-input formControlName="password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password"></ion-input>
            <ion-button slot="end" fill="clear" (click)="togglePasswordVisibility()" size="small">
              <ion-icon [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
            </ion-button>
          </ion-item>

          <div class="error-message" *ngIf="error">{{ error }}</div>

          <ion-button expand="block" type="submit" color="primary" [disabled]="isSubmitting">
            <ion-spinner *ngIf="isSubmitting" name="crescent" slot="start"></ion-spinner>
            {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </ion-content>
</ion-page>
