spring.application.name=smart-dashboard-backend

# Server binding - bind to 0.0.0.0 so devices on the same network can reach the backend
server.address=0.0.0.0
server.port=8080

# CORS configuration - allow requests from mobile app and development machines
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://192.168.0.31:3000,http://192.168.0.33:8080,capacitor://localhost,http://localhost
