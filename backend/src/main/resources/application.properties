spring.application.name=smart-dashboard-backend

# Server binding - bind to 0.0.0.0 so devices on the same network can reach the backend
server.address=0.0.0.0
server.port=8080

# CORS configuration. Override APP_CORS_ALLOWED_ORIGINS in production when the
# frontend is hosted on a different origin.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:*,http://127.0.0.1:3000,http://127.0.0.1:4200,http://192.168.0.31:3000,http://192.168.0.33:8080,capacitor://localhost,http://localhost,https://iccc.jk.gov.in,http://localhost:8080}
