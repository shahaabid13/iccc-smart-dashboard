<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Welcome to the Traffic & Video Management Dashboard</p>
  </header>

  <div class="cards-grid">
    <mat-card
      *ngFor="let card of dashboardCards"
      class="dashboard-card"
      [ngClass]="card.bgColor"
    >
      <mat-card-header>
        <mat-icon class="card-icon">{{ card.icon }}</mat-icon>
      </mat-card-header>

      <mat-card-content>
        <h2>{{ card.title }}</h2>
        <p>{{ card.description }}</p>
      </mat-card-content>

      <mat-card-actions>
        <a
          mat-raised-button
          color="primary"
          [routerLink]="card.route"
          class="action-button"
        >
          <mat-icon>{{ card.icon }}</mat-icon>
          {{ card.action }}
        </a>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
