<mat-card class="map-card">
  <mat-card-header>
    <mat-card-title>Channel Locations Map</mat-card-title>
    <button mat-icon-button (click)="resetMapView()" matTooltip="Reset View">
      <mat-icon>my_location</mat-icon>
    </button>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="loading()" class="loading">
      <mat-spinner></mat-spinner>
    </div>

    <div
      #mapContainer
      class="map-container"
      [class.hidden]="loading()"
    ></div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-title">Camera Types</div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #ff6b6b"></div>
        <span>ANPR</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #4ecdc4"></div>
        <span>Evidence</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #95e1d3"></div>
        <span>General</span>
      </div>
    </div>
  </mat-card-content>
</mat-card>
